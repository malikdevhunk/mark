    <text x="140" y="96" text-anchor="middle" fill="#9a968c" font-size="12">deposit, open, close</text>
    <text x="470" y="68" text-anchor="middle">mark_perp</text>
    <text x="470" y="92" text-anchor="middle" fill="#9a968c" font-size="12">exchange, market, position</text>
    <text x="470" y="116" text-anchor="middle" fill="#9a968c" font-size="12">bounded margin, funding</text>
